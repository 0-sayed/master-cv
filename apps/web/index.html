<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F1F0EB" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#100F0C" media="(prefers-color-scheme: dark)" />
		<!-- Apply the saved or system theme before first paint, so nothing flashes. Mirrors libs/theme.ts. -->
		<script>
			(() => {
				try {
					const match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
					const theme = match ? decodeURIComponent(match[1]) : "system";
					const dark =
						theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch {
					// Without cookies or matchMedia the page starts light, and the app corrects it once it loads.
				}
			})();
		</script>
		<meta name="application-name" content="Master CV" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Master CV" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta property="og:site_name" content="Master CV" />
		<meta property="og:title" content="Master CV" />
		<meta property="og:image" content="/opengraph/banner.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Master CV" />
		<meta name="twitter:image" content="/opengraph/banner.jpg" />
		<!-- Keep the homepage description between 120 and 160 characters. -->
		<meta
			name="description"
			content="Create and review your CV in a private account with Master CV. Download PDF for free. Word downloads and public sharing are not available."
		/>

		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>Master CV — A free and open-source resume builder</title>
	</head>
	<body>
		<!-- Empty here; the server prerenders the homepage into it (apps/server/src/static/web.ts). -->
		<div id="app"></div>
		<!-- Branded first paint; hidden once React populates #app (higher-specificity rule below). -->

		<div id="initial-loader" role="status" aria-label="Loading">
			<svg class="initial-loader__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
				<defs>
					<mask id="boot-c" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
						<path
							class="initial-loader__curve-reveal"
							d="M20 7 A10 10 0 1 0 20 25"
							pathLength="1"
							stroke="white"
							stroke-width="7"
							stroke-linecap="round"
						/>
					</mask>
					<mask id="boot-tick" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
						<path
							class="initial-loader__tick-reveal"
							d="M14.5 16 L18.7 20.2 L28 6.5"
							pathLength="1"
							stroke="white"
							stroke-width="7"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</mask>
				</defs>
				<g mask="url(#boot-c)">
					<path
						d="M3.6411 16C3.6411 13.9673 4.15737 11.9679 5.14159 10.1895C6.12581 8.41099 7.54576 6.91154 9.26805 5.83203C10.9903 4.75255 12.9587 4.12816 14.9883 4.01758C17.0179 3.907 19.0422 4.31421 20.8716 5.20019C21.8657 5.68165 22.2812 6.87748 21.7998 7.87158C21.3183 8.86567 20.1225 9.28122 19.1284 8.7998C17.9089 8.20915 16.5591 7.93803 15.206 8.01172C13.853 8.08544 12.5408 8.50201 11.3926 9.22168C10.2444 9.94136 9.29774 10.9408 8.64159 12.1265C7.98545 13.3121 7.6411 14.6449 7.6411 16C7.6411 17.3551 7.98545 18.6879 8.64159 19.8735C9.29774 21.0592 10.2444 22.0586 11.3926 22.7783C12.5408 23.498 13.853 23.9146 15.206 23.9883C16.5591 24.062 17.9089 23.7908 19.1284 23.2002C20.1225 22.7188 21.3183 23.1343 21.7998 24.1284C22.2812 25.1225 21.8657 26.3183 20.8716 26.7998C19.0422 27.6858 17.0179 28.093 14.9883 27.9824C12.9587 27.8718 10.9903 27.2475 9.26805 26.168C7.54576 25.0885 6.12581 23.589 5.14159 21.8105C4.15737 20.0321 3.6411 18.0327 3.6411 16Z"
						class="initial-loader__curve"
					/>
					<path
						d="M3.6411 16C3.6411 13.9673 4.15737 11.9679 5.14159 10.1895C6.12581 8.41099 7.54576 6.91154 9.26805 5.83203C10.9903 4.75255 12.9587 4.12816 14.9883 4.01758C17.0179 3.907 19.0422 4.31421 20.8716 5.20019C21.8657 5.68165 22.2812 6.87748 21.7998 7.87158C21.3183 8.86567 20.1225 9.28122 19.1284 8.7998C17.9089 8.20915 16.5591 7.93803 15.206 8.01172C13.853 8.08544 12.5408 8.50201 11.3926 9.22168C10.2444 9.94136 9.29774 10.9408 8.64159 12.1265C7.98545 13.3121 7.6411 14.6449 7.6411 16C7.6411 17.3551 7.98545 18.6879 8.64159 19.8735C9.29774 21.0592 10.2444 22.0586 11.3926 22.7783C12.5408 23.498 13.853 23.9146 15.206 23.9883C16.5591 24.062 17.9089 23.7908 19.1284 23.2002C20.1225 22.7188 21.3183 23.1343 21.7998 24.1284C22.2812 25.1225 21.8657 26.3183 20.8716 26.7998C19.0422 27.6858 17.0179 28.093 14.9883 27.9824C12.9587 27.8718 10.9903 27.2475 9.26805 26.168C7.54576 25.0885 6.12581 23.589 5.14159 21.8105C4.15737 20.0321 3.6411 18.0327 3.6411 16Z"
						class="initial-loader__tint"
					/>
				</g>
				<path
					d="M26.3403 5.38379C26.9568 4.46737 28.1997 4.22396 29.1162 4.84033C30.0326 5.45683 30.276 6.69974 29.6597 7.61621L20.4097 21.3662C20.076 21.8622 19.5378 22.1831 18.9429 22.2407C18.348 22.2984 17.7586 22.0867 17.3359 21.6641L13.0859 17.4141C12.3049 16.633 12.3049 15.367 13.0859 14.5859C13.867 13.8049 15.133 13.8049 15.9141 14.5859L18.4463 17.1182L26.3403 5.38379Z"
					class="initial-loader__tick"
					mask="url(#boot-tick)"
				/>
			</svg>
			<span class="initial-loader__spacer" aria-hidden="true"></span>
		</div>
		<style>
			/* First-paint mirror of T002 tokens before shared CSS loads. */
			#initial-loader {
				--boot-ink: var(--brand-mark-light-ink, #1c1b15);
				--boot-tick: var(--brand-mark-light-tick, #337344);
				--boot-cycle: calc(var(--motion-brand-total, 550ms) + var(--motion-brand-rest, 1800ms));
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--space-24, 24px);
				background: var(--bg, #f1f0eb);
			}
			html.dark #initial-loader {
				--boot-ink: var(--brand-mark-dark-ink, #efeeeb);
				--boot-tick: var(--brand-mark-dark-tick, #6fc082);
				background: var(--bg, #100f0c);
			}
			#app:not(:empty) ~ #initial-loader {
				display: none;
			}
			.initial-loader__mark {
				width: var(--space-48, 48px);
				height: var(--space-48, 48px);
			}
			.initial-loader__spacer {
				width: var(--space-24, 24px);
				height: var(--space-24, 24px);
			}
			.initial-loader__curve {
				fill: var(--boot-ink);
			}
			.initial-loader__tick,
			.initial-loader__tint {
				fill: var(--boot-tick);
			}
			.initial-loader__curve-reveal {
				animation: boot-curve var(--boot-cycle) var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1)) infinite;
			}
			.initial-loader__tick-reveal {
				animation: boot-tick var(--boot-cycle) var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1)) infinite;
			}
			.initial-loader__tint {
				opacity: 0;
				animation: boot-tint var(--boot-cycle) var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1)) infinite;
			}
			/* 300ms curve, 250ms tick, then 1800ms rest, matching BrandIcon's loop. */
			@keyframes boot-curve {
				0% {
					stroke-dasharray: 1;
					stroke-dashoffset: 1;
				}
				12.766%,
				100% {
					stroke-dasharray: 1;
					stroke-dashoffset: 0;
				}
			}
			@keyframes boot-tick {
				0%,
				12.766% {
					stroke-dasharray: 1;
					stroke-dashoffset: 1;
				}
				21.277% {
					stroke-dasharray: 1;
					stroke-dashoffset: -0.03;
				}
				23.404%,
				100% {
					stroke-dasharray: 1;
					stroke-dashoffset: 0;
				}
			}
			@keyframes boot-tint {
				0%,
				8.191%,
				23.404%,
				100% {
					opacity: 0;
				}
				15.213% {
					opacity: 0.85;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.initial-loader__curve-reveal,
				.initial-loader__tick-reveal,
				.initial-loader__tint {
					animation: none;
				}
			}
		</style>

		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
