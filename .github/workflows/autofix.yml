name: Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject conflict markers
        run: |
          status=0
          git grep -nE '^(<{7} |={7}$|>{7} )' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Unresolved conflict markers found.' >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - run: pnpm validate:static
      - name: Ensure validation did not rewrite source
        run: git diff --exit-code
