name: Application Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_URL: http://localhost:3000
  PORT: "3000"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/postgres
  FLAG_DISABLE_SIGNUPS: "false"
  FLAG_DISABLE_EMAIL_AUTH: "false"
  FLAG_ENABLE_GUEST_LOGIN: "false"
  FLAG_DISABLE_API_RATE_LIMIT: "true"
  STORAGE_BACKEND: local
  LOCAL_STORAGE_PATH: /tmp/reactive-resume-e2e-storage
  # The assistant spec talks to a scripted provider on 127.0.0.1.
  FLAG_ALLOW_UNSAFE_AI_BASE_URL: "true"
  # Real-database unit suites. The cover-letter suite works in its own schema; the OAuth flow suite writes
  # signing keys under its own secret, so it gets a database the e2e server never reads.
  COVER_LETTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  INTEGRATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oauth_test

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.label }}
    # Browser qualification links the same checksum-pinned Ubuntu 22.04 reader as the document job.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: unit, label: "Unit and integration" }
          - { part: browser, shard: 1, label: "Browser 1/6" }
          - { part: browser, shard: 2, label: "Browser 2/6" }
          - { part: browser, shard: 3, label: "Browser 3/6" }
          - { part: browser, shard: 4, label: "Browser 4/6" }
          - { part: browser, shard: 5, label: "Browser 5/6" }
          - { part: browser, shard: 6, label: "Browser 6/6" }

    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        if: ${{ vars.USE_BLACKSMITH != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout Repository (Blacksmith)
        if: ${{ vars.USE_BLACKSMITH == 'true' }}
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Turbo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned document toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/document-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-document-toolchain-${{ hashFiles('tooling/document-qualification/install-poppler.mjs', 'tooling/document-qualification/versions.json') }}

      - name: Install PDF Text Extractor
        timeout-minutes: 6
        run: |
          # Reader runtime libraries are preinstalled on ubuntu-22.04; apt only repairs missing ones.
          missing=()
          for package in libfontconfig1 libfreetype6 libjpeg8 liblcms2-2 libnspr4 libnss3 libopenjp2-7 libpng16-16 libstdc++6 libtiff5 zlib1g libcairo2; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            apt_options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo timeout 120 apt-get "${apt_options[@]}" update
            sudo timeout 120 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          fi
          node tooling/document-qualification/install-poppler.mjs
          echo "$GITHUB_WORKSPACE/.cache/document-toolchain/bin" >> "$GITHUB_PATH"

      - name: Check Package Boundaries
        if: matrix.part == 'unit'
        run: pnpm exec turbo boundaries

      - name: Install Playwright Browser
        if: matrix.part == 'browser'
        timeout-minutes: 10
        # ubuntu-22.04 already supplies Chromium runtime libraries; retain Playwright host validation.
        run: pnpm exec playwright install chromium

      - name: Generate Test Secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Prepare Storage
        run: mkdir -p "$LOCAL_STORAGE_PATH"

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Prepare OAuth Test Database
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE oauth_test"
          DATABASE_URL="$OAUTH_TEST_DATABASE_URL" DATABASE_MIGRATION_URL="$OAUTH_TEST_DATABASE_URL" pnpm db:migrate

      - name: Prepare restricted synthetic runtime role
        run: |
          node tooling/local/database-roles.mjs
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const line=readFileSync(".env.runtime.local","utf8").split("\n").find(value=>value.startsWith("DATABASE_URL=")); appendFileSync(process.env.GITHUB_ENV,`${line}\n`);'

      # Runs every workspace that declares test:ci. Mobile has no such script;
      # its inherited Hermes/native prerequisite is recorded in docs/development.md.
      # Serial execution: the PDF
      # rasterization and API rate-limit suites time out when several packages' Vitest
      # thread pools oversubscribe the runner at once.
      - name: Run Unit Tests
        if: matrix.part == 'unit'
        run: pnpm exec turbo run test:ci --concurrency=1

      - name: Build
        if: matrix.part == 'browser'
        run: pnpm build

      # Discover the complete suite and balance measured spec durations across six runners.
      - name: Run E2E Tests
        if: matrix.part == 'browser'
        run: node tooling/local/e2e-partition.mjs ${{ matrix.shard }} 6 --output test-results/browser

      - name: Run Bounded AI Runtime Browser Test
        if: matrix.part == 'browser' && matrix.shard == 6
        run: pnpm exec playwright test --config tests/e2e/t005-runtime.config.ts --output test-results/runtime-browser

      - name: Run Reviewed AI Browser Tests With Synthetic Runtime
        if: matrix.part == 'browser' && matrix.shard == 6
        run: pnpm exec playwright test --config tests/e2e/reviewable-ai-runtime.config.ts --output test-results/review-browser

      - name: Upload Playwright Report
        if: always() && matrix.part == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for branch protection, summarising every unit and browser shard.
  e2e:
    name: Unit integration and browser
    if: always()
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every test shard to pass
        run: test "${{ needs.tests.result }}" = "success"

  document-qualification:
    name: Arabic document qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache pinned document toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/document-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-document-toolchain-${{ hashFiles('tooling/document-qualification/install-poppler.mjs', 'tooling/document-qualification/versions.json') }}

      - name: Prepare pinned independent reader
        timeout-minutes: 6
        id: reader
        run: |
          # Reader runtime libraries are preinstalled on ubuntu-22.04; apt only repairs missing ones.
          missing=()
          for package in libfontconfig1 libfreetype6 libjpeg8 liblcms2-2 libnspr4 libnss3 libopenjp2-7 libpng16-16 libstdc++6 libtiff5 zlib1g libcairo2; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            apt_options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo timeout 120 apt-get "${apt_options[@]}" update
            sudo timeout 120 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          fi
          node tooling/document-qualification/install-poppler.mjs
          echo "$GITHUB_WORKSPACE/.cache/document-toolchain/bin" >> "$GITHUB_PATH"
      - name: Qualify 12 smoke cases
        # Report-only: D33 accepts reordered Arabic range extraction; evidence is uploaded for review.
        continue-on-error: true
        run: pnpm --filter @reactive-resume/tooling test:documents
      - name: Evaluate 50 draft pilot cases
        continue-on-error: true
        if: always() && steps.reader.outcome == 'success'
        env:
          DOCUMENT_PILOT: "1"
        run: pnpm --filter @reactive-resume/tooling test:documents
      - name: Evaluate template diagnostics
        continue-on-error: true
        if: always() && steps.reader.outcome == 'success'
        env:
          DOCUMENT_MATRIX: "1"
        run: pnpm --filter @reactive-resume/tooling test:documents
      - name: Evaluate historical reader diagnostics
        # Only individually reviewed reader limitations run here; passing regressions remain blocking.
        continue-on-error: true
        if: always() && steps.reader.outcome == 'success'
        env:
          DOCUMENT_REGRESSIONS: "1"
        run: pnpm --filter @reactive-resume/tooling test:documents
      - name: Upload document evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: document-qualification
          path: test-results/document-qualification
          if-no-files-found: error
          retention-days: 7
