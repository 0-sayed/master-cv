name: Deploy to Contabo

on:
  push:
    branches: [main]
    paths-ignore:
      - "Planning/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  # Deploys run one at a time, in merge order.
  group: deploy-contabo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == '0-sayed/sirawise' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: deploy/contabo/deploy.sh
