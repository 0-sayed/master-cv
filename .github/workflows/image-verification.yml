name: Image Verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          outputs: type=cacheonly
          platforms: linux/amd64
          cache-from: type=gha,scope=master-cv-image
          cache-to: type=gha,mode=max,scope=master-cv-image
          build-args: APP_REVISION=${{ github.sha }}
