name: sirawise

services:
  app:
    image: sirawise-app:${SIRAWISE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: /opt/sirawise/.env
        required: false
    environment:
      PORT: "3000"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/data
      DEPLOYMENT_NAMESPACE: sirawise
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - sirawise_storage:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirawise
      POSTGRES_USER: sirawise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/sirawise/.env}
    volumes:
      - sirawise_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sirawise -d sirawise]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  sirawise_pg:
    name: sirawise_pg
  sirawise_storage:
    name: sirawise_storage
